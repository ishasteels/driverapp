<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#D51515">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ISE Vehicles">
  <title>ISE Driver App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <style>
:root {
  --color-primary:#D51515; --color-primaryDark:#A80F0F; --color-primaryLight:#FF4444;
  --color-secondary:#2B2B2B; --color-surface:#FFFFFF; --color-background:#F0F2F5;
  --color-border:#E4E6EA; --color-text:#1A1A1A; --color-textSub:#6B7280;
  --color-success:#27AE60; --color-warning:#F59E0B; --color-danger:#EF4444; --color-info:#3B82F6;
  --nav-h:62px; --header-h:56px; --radius:12px; --radius-sm:8px;
  --shadow:0 1px 4px rgba(0,0,0,.08); --shadow-md:0 4px 12px rgba(0,0,0,.12); --shadow-lg:0 8px 24px rgba(0,0,0,.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;
  background:var(--color-background);color:var(--color-text);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
input,select,button,textarea{font-family:inherit}
button{cursor:pointer;border:none;outline:none;background:none}
a{color:inherit;text-decoration:none}

/* ─── LOADER ─── */
#loader{position:fixed;inset:0;background:linear-gradient(135deg,#D51515 0%,#8B0000 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff}
.ld-logo{font-size:3rem;font-weight:900;letter-spacing:4px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.ld-name{font-size:.85rem;opacity:.85;margin-top:.2rem;letter-spacing:1px}
.ld-spin{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .8s linear infinite;margin:2rem 0 1rem}
#loader p{font-size:.82rem;opacity:.75}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── LOGIN ─── */
#login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:2rem 1.5rem;background:linear-gradient(180deg,#FFF5F5 0%,#F0F2F5 100%)}
.login-logo{display:flex;flex-direction:column;align-items:center;margin-bottom:2.5rem;gap:.5rem}
.login-icon{width:88px;height:88px;background:linear-gradient(135deg,#D51515,#8B0000);
  border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;
  box-shadow:0 8px 24px rgba(213,21,21,.35)}
.login-company{font-size:1.15rem;font-weight:800;color:#1A1A1A}
.login-tagline{font-size:.75rem;color:var(--color-textSub);text-align:center}
.login-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);
  padding:2rem 1.5rem;width:100%;max-width:380px}
.login-card h2{font-size:1.15rem;font-weight:700;margin-bottom:1.5rem;color:var(--color-secondary)}
.login-card input{width:100%;border:1.5px solid var(--color-border);border-radius:var(--radius-sm);
  padding:.75rem 1rem;font-size:.95rem;margin-bottom:.9rem;transition:border-color .2s;background:#FAFAFA}
.login-card input:focus{border-color:var(--color-primary);background:#fff;outline:none}
#btn-login{width:100%;background:linear-gradient(135deg,#D51515,#A80F0F);color:#fff;
  border-radius:var(--radius-sm);padding:.9rem;font-size:1rem;font-weight:700;
  box-shadow:0 4px 12px rgba(213,21,21,.3);transition:transform .15s,box-shadow .15s;margin-top:.3rem}
#btn-login:active{transform:scale(.98);box-shadow:0 2px 6px rgba(213,21,21,.2)}
#btn-login:disabled{opacity:.6}

/* ─── APP SHELL ─── */
#app-shell{display:none;flex-direction:column;height:100vh;overflow:hidden}

/* Header */
.app-header{height:var(--header-h);background:linear-gradient(135deg,#D51515 0%,#A80F0F 100%);
  display:flex;align-items:center;padding:0 1rem;gap:.75rem;flex-shrink:0;z-index:200;
  box-shadow:0 2px 8px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0)}
.header-icon{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.header-title{color:#fff;font-weight:800;font-size:1rem;flex:1;letter-spacing:.3px}
.header-user-wrap{display:flex;align-items:center;gap:.5rem}
#user-name{color:#fff;font-size:.78rem;font-weight:600}
#user-role{color:rgba(255,255,255,.75);font-size:.65rem;display:block}
.header-signout{background:rgba(255,255,255,.18);color:#fff;border-radius:6px;
  padding:.28rem .6rem;font-size:.7rem;font-weight:600;white-space:nowrap}

/* Main content */
#main-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + 1rem)}

/* Bottom nav */
#bottom-nav{height:var(--nav-h);background:#fff;border-top:1px solid var(--color-border);
  display:flex;align-items:stretch;flex-shrink:0;z-index:200;
  padding-bottom:max(env(safe-area-inset-bottom),2px);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--color-textSub);font-size:.6rem;gap:.18rem;height:100%;padding:.25rem .1rem;
  position:relative;transition:color .15s;border-top:2.5px solid transparent}
.nav-icon{font-size:1.3rem;line-height:1}
.nav-btn.active{color:var(--color-primary);border-top-color:var(--color-primary)}
.nav-label{font-weight:600;letter-spacing:.01em}

/* ─── CONTENT LAYOUT ─── */
.content-pad{padding:.9rem}

/* Page header */
.page-header{position:sticky;top:0;z-index:50;background:var(--color-surface);
  border-bottom:1px solid var(--color-border);padding:.7rem 1rem;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 1px 4px rgba(0,0,0,.05)}
.page-title{font-size:1rem;font-weight:800;color:var(--color-secondary)}
.page-actions{display:flex;gap:.4rem;align-items:center}

/* Buttons */
.btn-sm{font-size:.78rem;padding:.38rem .8rem;border-radius:6px;font-weight:700}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:active{opacity:.85}
.btn-ghost{background:var(--color-background);color:var(--color-secondary);border:1.5px solid var(--color-border)}
.btn-danger{background:var(--color-danger);color:#fff;width:100%;padding:.9rem;border-radius:var(--radius-sm);font-size:.95rem;font-weight:700;margin-top:1rem}
.btn-action{flex:1;background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:var(--radius-sm);padding:.7rem .5rem;font-size:.8rem;font-weight:700;color:var(--color-secondary);transition:all .15s}
.btn-action:active{background:var(--color-background)}
.action-btns{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap}

/* Section header */
.section-header{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--color-textSub);padding:.6rem 0 .3rem;border-bottom:1px solid var(--color-border);margin-bottom:.5rem}

/* ─── HERO STATS ─── */
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.8rem}
@media(max-width:340px){.hero-stats{grid-template-columns:repeat(2,1fr)}}
.hs-item{background:var(--color-surface);border-radius:var(--radius-sm);padding:.7rem .5rem;
  text-align:center;border-top:3px solid var(--color-primary);box-shadow:var(--shadow)}
.hs-icon{font-size:1.1rem;margin-bottom:.2rem}
.hs-val{font-size:1rem;font-weight:800;color:var(--color-primary)}
.hs-label{font-size:.6rem;color:var(--color-textSub);font-weight:600;margin-top:.1rem}

/* Finance strip */
.finance-strip{background:var(--color-secondary);border-radius:var(--radius);padding:.8rem;
  display:flex;align-items:center;margin-bottom:.8rem;overflow-x:auto;gap:0}
.fs-item{flex:1;text-align:center;min-width:70px}
.fs-sep{width:1px;background:rgba(255,255,255,.15);height:28px;flex-shrink:0}
.fs-label{font-size:.6rem;color:rgba(255,255,255,.65);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.fs-val{font-size:.95rem;font-weight:800;color:#fff;margin-top:.15rem}

/* Chart card */
.chart-card{background:var(--color-surface);border-radius:var(--radius);padding:.9rem;
  box-shadow:var(--shadow);margin-bottom:.8rem}
.cc-title{font-size:.75rem;font-weight:700;color:var(--color-textSub);margin-bottom:.5rem}
canvas{width:100%;display:block}

/* Alert cards */
.alert-card{border-radius:var(--radius-sm);padding:.8rem 1rem;margin-bottom:.8rem;font-size:.82rem;line-height:1.5}
.alert-card.danger{background:#FEF2F2;border-left:4px solid var(--color-danger)}
.alert-card.info{background:#EFF6FF;border-left:4px solid var(--color-info)}
.alert-card.warning{background:#FFFBEB;border-left:4px solid var(--color-warning)}
.ac-title{font-weight:700;margin-bottom:.3rem;font-size:.82rem}
.ac-row{padding:.2rem 0;font-size:.78rem;color:var(--color-textSub)}

/* ─── VEHICLE CARDS ─── */
.veh-card{background:var(--color-surface);border-radius:var(--radius);padding:.9rem;
  margin-bottom:.6rem;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s,transform .1s}
.veh-card:active{transform:scale(.99);box-shadow:var(--shadow-md)}
.vc2-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem}
.vc2-plate-wrap{}
.vc2-plate{font-size:1.1rem;font-weight:900;letter-spacing:1.5px;background:var(--color-secondary);
  color:#fff;display:inline-block;padding:.1rem .5rem;border-radius:5px}
.vc2-brand{font-size:.75rem;color:var(--color-textSub);margin-top:.25rem}
.vc2-health{font-size:.68rem;font-weight:700;padding:.25rem .55rem;border-radius:999px;
  display:flex;align-items:center;gap:.25rem}
.vc2-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.vc2-pills{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.5rem}
.vc2-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.vc2-stat{background:var(--color-background);border-radius:6px;padding:.4rem .3rem;text-align:center}
.vs-val{font-size:.82rem;font-weight:700;color:var(--color-secondary)}
.vs-label{font-size:.58rem;color:var(--color-textSub)}
.vc2-stat.red .vs-val{color:var(--color-danger)}

/* Vehicle detail hero */
.vd-hero{background:linear-gradient(135deg,#2B2B2B,#1a1a1a);border-radius:var(--radius);
  padding:1.2rem;margin-bottom:.8rem;color:#fff}
.vd-plate{font-size:1.6rem;font-weight:900;letter-spacing:3px}
.vd-name{font-size:.82rem;opacity:.75;margin-top:.3rem}
.vd-pills{display:flex;gap:.35rem;margin-top:.5rem;flex-wrap:wrap}
.vd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}
.vd-stat-card{background:var(--color-surface);border-radius:var(--radius-sm);padding:.7rem .5rem;text-align:center;box-shadow:var(--shadow)}
.vds-icon{font-size:1.1rem;margin-bottom:.2rem}
.vds-val{font-size:.95rem;font-weight:800;color:var(--color-secondary)}
.vds-label{font-size:.6rem;color:var(--color-textSub)}
.doc-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}
.doc-status-card{background:var(--color-surface);border-radius:var(--radius-sm);padding:.7rem .5rem;
  text-align:center;box-shadow:var(--shadow);border-top:3px solid}
.dsc-icon{font-size:1.1rem;margin-bottom:.15rem}
.dsc-label{font-size:.65rem;color:var(--color-textSub);font-weight:600}
.dsc-val{font-size:.7rem;font-weight:700;margin-top:.1rem;word-break:break-all}
.dsc-days{font-size:.65rem;font-weight:700;margin-top:.1rem}
.detail-grid{background:var(--color-surface);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:.8rem;box-shadow:var(--shadow)}
.dr-row{display:flex;padding:.55rem .8rem;border-bottom:1px solid var(--color-border);font-size:.8rem}
.dr-row:last-child{border-bottom:none}
.dr-label{color:var(--color-textSub);flex:0 0 38%;font-weight:600;font-size:.75rem}
.dr-val{flex:1;font-weight:500;word-break:break-word}

/* ─── DRIVER CARDS ─── */
.drv-card{background:var(--color-surface);border-radius:var(--radius);padding:.9rem;
  margin-bottom:.6rem;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s}
.drv-card:active{box-shadow:var(--shadow-md)}
.dc-top{display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem}
.dc-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:1rem;flex-shrink:0}
.dc-info{flex:1;min-width:0}
.dc-name{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-sub{font-size:.7rem;color:var(--color-textSub);margin-top:.1rem}
.dc-salary{text-align:right;flex-shrink:0}
.dc-salary{font-size:.9rem;font-weight:800;color:var(--color-primary)}
.dc-salary span{font-size:.6rem;color:var(--color-textSub);display:block;font-weight:400}
.dc-bottom{display:flex;gap:.3rem;flex-wrap:wrap}

/* Driver detail hero */
.drv-hero{display:flex;align-items:center;gap:1rem;background:var(--color-secondary);
  border-radius:var(--radius);padding:1.2rem;margin-bottom:.8rem;color:#fff}
.dh-avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:1.4rem;flex-shrink:0}
.dh-name{font-size:1.1rem;font-weight:800}
.dh-id{font-size:.72rem;opacity:.7;margin-top:.1rem;margin-bottom:.3rem}

/* ─── PILLS ─── */
.pill{display:inline-block;font-size:.65rem;padding:.18rem .45rem;border-radius:999px;
  background:var(--color-background);color:var(--color-textSub);font-weight:600;border:1px solid var(--color-border)}
.pill-warn{background:#FFFBEB;border-color:#F59E0B;color:#92400E}

/* ─── BADGES ─── */
.badge{display:inline-block;font-size:.65rem;font-weight:700;padding:.18rem .45rem;border-radius:999px;text-transform:capitalize}
.badge-active,.badge-completed,.badge-present,.badge-delivered,.badge-good{background:#DCFCE7;color:#166534}
.badge-inactive,.badge-absent,.badge-critical{background:#FEE2E2;color:#991B1B}
.badge-pending,.badge-in-transit,.badge-progress{background:#FEF3C7;color:#92400E}
.badge-late,.badge-warn{background:#FEF9C3;color:#854D0E}
.badge-high{background:#FEE2E2;color:#991B1B}
.badge-medium{background:#FEF3C7;color:#92400E}
.badge-low{background:#DCFCE7;color:#166534}
.badge-admin{background:#F3E8FF;color:#6B21A8}
.badge-manager{background:#DBEAFE;color:#1E40AF}
.badge-driver{background:#DCFCE7;color:#166534}
.red{color:var(--color-danger)!important}

/* ─── MY VEHICLE CARD (driver home) ─── */
.my-vehicle-card{background:linear-gradient(135deg,#1a1a1a,#2B2B2B);border-radius:var(--radius);
  padding:1.1rem;display:flex;justify-content:space-between;align-items:center;
  margin-bottom:.8rem;cursor:pointer}
.mvc-plate{font-size:1.3rem;font-weight:900;letter-spacing:2.5px;color:#fff}
.mvc-brand{font-size:.75rem;color:rgba(255,255,255,.7);margin-top:.2rem}
.mvc-meta{font-size:.68rem;color:rgba(255,255,255,.5);margin-top:.1rem}
.mvc-right{text-align:right;color:#fff}
.mvc-km{font-size:1.4rem;font-weight:900}
.mvc-km-label{font-size:.6rem;color:rgba(255,255,255,.6);margin-top:-.1rem}
.mvc-fastag{font-size:.72rem;color:rgba(255,255,255,.75);margin-top:.4rem}

/* Month strip */
.month-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:.8rem}
.ms-item{background:var(--color-surface);border-radius:var(--radius-sm);padding:.6rem .3rem;text-align:center;box-shadow:var(--shadow)}
.ms-val{font-size:1.1rem;font-weight:800;color:var(--color-primary)}
.ms-label{font-size:.6rem;color:var(--color-textSub)}

/* Big actions (driver home) */
.big-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}
.ba-btn{background:var(--color-surface);border-radius:var(--radius-sm);padding:.85rem .4rem;
  display:flex;flex-direction:column;align-items:center;gap:.3rem;border-top:3px solid;
  box-shadow:var(--shadow);transition:all .15s}
.ba-btn:active{transform:scale(.97)}
.ba-icon{font-size:1.5rem;line-height:1}
.ba-label{font-size:.65rem;color:var(--color-textSub);text-align:center;font-weight:700}

/* Attendance calendar */
.att-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.2rem;margin-bottom:.8rem}
.cal-head{text-align:center;font-size:.62rem;font-weight:700;color:var(--color-textSub);padding:.2rem}
.cal-cell{text-align:center;font-size:.68rem;padding:.35rem .1rem;border-radius:6px;
  background:var(--color-background);color:var(--color-textSub);font-weight:500}
.cal-present{background:#DCFCE7;color:#166534;font-weight:700}
.cal-absent{background:#FEE2E2;color:#991B1B;font-weight:700}
.cal-late{background:#FEF3C7;color:#92400E;font-weight:700}
.cal-today{background:var(--color-primary);color:#fff;font-weight:700}

/* Attendance summary bar */
.att-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:.8rem}
.as-item{border-radius:var(--radius-sm);padding:.6rem .4rem;text-align:center;box-shadow:var(--shadow)}
.as-num{font-size:1.2rem;font-weight:800}
.as-label{font-size:.6rem;font-weight:600;margin-top:.1rem}
.as-present{background:#DCFCE7;color:#166534}
.as-absent{background:#FEE2E2;color:#991B1B}
.as-late{background:#FEF3C7;color:#92400E}
.as-total{background:var(--color-surface);color:var(--color-secondary)}

/* ─── LIST CARDS ─── */
.list-card{background:var(--color-surface);border-radius:var(--radius-sm);padding:.85rem;
  margin-bottom:.5rem;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .12s}
.list-card:active{box-shadow:var(--shadow-md)}
.lc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.2rem}
.lc-sub{font-size:.72rem;color:var(--color-textSub);font-weight:400}
.lc-meta{font-size:.72rem;color:var(--color-textSub);margin-top:.15rem}
.plate-tag{background:var(--color-secondary);color:#fff;border-radius:4px;padding:.1rem .4rem;font-size:.78rem;letter-spacing:1px;font-weight:700}

/* ─── TABLE ─── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius-sm);
  box-shadow:var(--shadow);background:var(--color-surface);margin-bottom:.8rem}
table{width:100%;border-collapse:collapse;font-size:.74rem;min-width:400px}
th{background:var(--color-secondary);color:#fff;padding:.5rem .65rem;text-align:left;
  white-space:nowrap;font-weight:700;font-size:.7rem;letter-spacing:.03em}
td{padding:.45rem .65rem;border-bottom:1px solid var(--color-border);vertical-align:middle;
  color:var(--color-text)}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:#FAFAFA}

/* ─── EMPTY STATE ─── */
.empty-state{text-align:center;padding:2.5rem 1rem}
.es-icon{font-size:2.5rem;margin-bottom:.5rem;opacity:.5}
.es-title{font-weight:700;color:var(--color-secondary);margin-bottom:.25rem}
.es-sub{font-size:.78rem;color:var(--color-textSub)}

/* ─── SEARCH BAR ─── */
.search-bar{display:flex;align-items:center;gap:.6rem;background:var(--color-surface);
  border-bottom:1px solid var(--color-border);padding:.6rem .9rem}
.sb-icon{font-size:1rem;flex-shrink:0;color:var(--color-textSub)}
.sb-input{flex:1;border:none;outline:none;font-size:.85rem;color:var(--color-text);background:transparent}

/* ─── FORMS ─── */
.form-card{background:var(--color-surface);border-radius:var(--radius);padding:1.1rem;box-shadow:var(--shadow)}
.f-group{margin-bottom:.85rem}
.f-group label{display:block;font-size:.74rem;font-weight:700;color:var(--color-textSub);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em}
.f-group input,.f-group select,.f-group textarea{width:100%;border:1.5px solid var(--color-border);border-radius:var(--radius-sm);
  padding:.65rem .85rem;font-size:.9rem;background:var(--color-surface);transition:border-color .2s;color:var(--color-text)}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{border-color:var(--color-primary);outline:none}
.f-group textarea{resize:none}
.full-btn{width:100%;padding:.9rem;border-radius:var(--radius-sm);font-size:.95rem;font-weight:800;
  margin-top:.5rem;background:linear-gradient(135deg,#D51515,#A80F0F);color:#fff;
  box-shadow:0 4px 12px rgba(213,21,21,.3)}
.full-btn:active{opacity:.9;transform:scale(.99)}
.full-btn:disabled{opacity:.55}
.calc-preview{background:var(--color-background);border-radius:var(--radius-sm);padding:.6rem .8rem;
  font-size:.78rem;color:var(--color-secondary);margin-bottom:.5rem;border:1px dashed var(--color-border)}

/* Check rows (inspection/cleaning) */
.checks-section{margin:.5rem 0}
.check-row{display:flex;align-items:center;justify-content:space-between;
  padding:.55rem 0;border-bottom:1px solid var(--color-border)}
.check-row:last-child{border-bottom:none}
.cr-label{font-size:.82rem;font-weight:500}
.cr-toggle{display:flex;gap:.3rem;background:var(--color-background);border-radius:999px;padding:.15rem}
.tg-yes,.tg-no{border-radius:999px;padding:.25rem .7rem;font-size:.72rem;font-weight:700;transition:all .15s;color:var(--color-textSub)}
.tg-yes.active{background:#DCFCE7;color:#166534}
.tg-no.active{background:#FEE2E2;color:#991B1B}

/* Att modal buttons */
.att-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.8rem}
.btn-att-in{background:linear-gradient(135deg,#27AE60,#1A8C4E);color:#fff;border-radius:var(--radius-sm);padding:.8rem;font-size:.85rem;font-weight:700;box-shadow:0 3px 8px rgba(39,174,96,.3)}
.btn-att-out{background:linear-gradient(135deg,#E74C3C,#C0392B);color:#fff;border-radius:var(--radius-sm);padding:.8rem;font-size:.85rem;font-weight:700;box-shadow:0 3px 8px rgba(231,76,60,.3)}

/* ─── FASTAG GRID ─── */
.fastag-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:.8rem}
.ft-card{background:var(--color-surface);border-radius:var(--radius-sm);padding:.85rem;text-align:center;
  box-shadow:var(--shadow);border-top:3px solid}
.ft-plate{font-size:.9rem;font-weight:900;letter-spacing:1px;color:var(--color-secondary)}
.ft-no{font-size:.6rem;color:var(--color-textSub);margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft-bal{font-size:1.2rem;font-weight:900;margin-top:.4rem}
.ft-label{font-size:.65rem;font-weight:700;margin-top:.15rem}

/* ─── EXPENSE BREAKDOWN ─── */
.breakdown-list{background:var(--color-surface);border-radius:var(--radius-sm);padding:.8rem;margin-bottom:.8rem;box-shadow:var(--shadow)}
.bl-item{margin-bottom:.5rem}
.bl-item:last-child{margin-bottom:0}
.bl-row{display:flex;justify-content:space-between;font-size:.75rem;font-weight:600;margin-bottom:.2rem}
.progress-bar{height:5px;background:var(--color-background);border-radius:999px;overflow:hidden}
.pb-fill{height:100%;background:var(--color-primary);border-radius:999px;transition:width .4s ease}

/* ─── MODULE GRID ─── */
.module-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.module-tile{background:var(--color-surface);border-radius:var(--radius-sm);border-top:3px solid var(--mc,var(--color-primary));
  padding:.65rem .3rem;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s}
.module-tile:active{transform:scale(.95)}
.mt-icon{font-size:1.25rem}
.mt-label{font-size:.58rem;color:var(--color-textSub);margin-top:.25rem;font-weight:700;line-height:1.2}

/* ─── SETTINGS ─── */
.settings-profile{display:flex;align-items:center;gap:.8rem;background:var(--color-secondary);
  border-radius:var(--radius);padding:1rem;margin-bottom:.8rem;color:#fff}
.sp-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1.3rem;font-weight:700;color:#fff;flex-shrink:0}
.sp-name{font-size:1rem;font-weight:800}
.sp-email{font-size:.72rem;opacity:.7;margin-top:.1rem}
.settings-list{background:var(--color-surface);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow);margin-bottom:.8rem}
.setting-row{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;border-bottom:1px solid var(--color-border);cursor:pointer}
.setting-row:last-child{border-bottom:none}
.sr-icon{font-size:1.1rem;flex-shrink:0}
.sr-label{flex:1;font-size:.82rem;font-weight:600}
.sr-val{font-size:.75rem;color:var(--color-textSub)}
.sr-arrow{color:var(--color-textSub);font-size:1.2rem}
.perm-list{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.8rem}
.perm-badge{background:var(--color-background);border:1px solid var(--color-border);
  border-radius:999px;padding:.2rem .55rem;font-size:.68rem;font-weight:700;color:var(--color-secondary)}

/* ─── FAB ─── */
.fab{position:fixed;bottom:calc(var(--nav-h) + 1rem);right:1rem;width:48px;height:48px;
  background:var(--color-secondary);color:#fff;border-radius:50%;font-size:1.2rem;
  box-shadow:var(--shadow-lg);z-index:200;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}

/* ─── MODAL ─── */
#global-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:flex-end}
.modal-inner{background:var(--color-surface);border-radius:18px 18px 0 0;width:100%;
  max-height:88vh;overflow-y:auto;padding:1rem 1rem 1.5rem;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;
  padding-bottom:.8rem;border-bottom:1px solid var(--color-border);margin-bottom:1rem}
#modal-title{font-size:1rem;font-weight:800}
.modal-close{background:var(--color-background);border-radius:50%;width:30px;height:30px;
  font-size:1rem;color:var(--color-textSub);display:flex;align-items:center;justify-content:center}

/* ─── TOASTS ─── */
.toast{position:fixed;bottom:calc(var(--nav-h) + 1.2rem);left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--color-secondary);color:#fff;border-radius:var(--radius-sm);padding:.65rem 1.2rem;
  font-size:.82rem;font-weight:700;z-index:2000;opacity:0;transition:all .28s;white-space:nowrap;
  box-shadow:var(--shadow-lg);max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:#15803D}
.toast-danger{background:#DC2626}
.toast-warning{background:#D97706}
.toast-info{background:#2563EB}
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="ld-logo">ISE</div>
  <div class="ld-name">ISHA STEELS ENTERPRISES</div>
  <div class="ld-spin"></div>
  <p>App load ho rahi hai...</p>
</div>

<!-- LOGIN -->
<div id="login-screen" style="display:none">
  <div class="login-logo">
    <div class="login-icon">🚗</div>
    <div class="login-company">Isha Steels Enterprises</div>
    <div class="login-tagline">Vehicle Operations Management System</div>
  </div>
  <div class="login-card">
    <h2>Login Karo</h2>
    <input id="inp-email" type="email" placeholder="Email address" autocomplete="email" autocapitalize="none">
    <input id="inp-pass"  type="password" placeholder="Password" autocomplete="current-password">
    <button id="btn-login" onclick="_doLogin()">Login</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-shell" style="display:none">
  <div class="app-header">
    <div class="header-icon">🚗</div>
    <div class="header-title">ISE Vehicles</div>
    <div class="header-user-wrap">
      <div>
        <span id="user-name">—</span>
        <span id="user-role">—</span>
      </div>
      <button class="header-signout" onclick="_signOut()">Exit</button>
    </div>
  </div>
  <div id="main-content"></div>
  <div id="bottom-nav"></div>
</div>

<!-- MODAL -->
<div id="global-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-inner">
    <div class="modal-header">
      <span id="modal-title">—</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="appconfig.js"></script>
<script src="app.js"></script>
<script>
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') _doLogin();
  });
  setTimeout(function() {
    var l = document.getElementById('loader');
    if (l && document.getElementById('login-screen').style.display === '') l.style.display = 'none';
  }, 300);
</script>
</body>
</html>
