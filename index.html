<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#D51515">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ISE Vehicles">
  <title>ISE Driver App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <style>
    /* ─── CSS VARIABLES (set by app.js at runtime) ── */
    :root {
      --color-primary:       #D51515;
      --color-primary-dark:  #A80F0F;
      --color-primary-light: #FF4444;
      --color-secondary:     #2B2B2B;
      --color-surface:       #FFFFFF;
      --color-background:    #F4F4F4;
      --color-border:        #E0E0E0;
      --color-text:          #2B2B2B;
      --color-text-sub:      #666666;
      --color-success:       #27AE60;
      --color-warning:       #F39C12;
      --color-danger:        #E74C3C;
      --color-info:          #2980B9;
      --nav-h:               64px;
      --header-h:            56px;
      --radius:              10px;
      --shadow:              0 2px 8px rgba(0,0,0,0.10);
    }

    /* ─── RESET ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-background); color: var(--color-text);
      -webkit-tap-highlight-color: transparent; overflow-x: hidden;
    }
    input, select, button, textarea { font-family: inherit; }
    button { cursor: pointer; border: none; outline: none; }

    /* ─── LOADER ─── */
    #loader {
      position: fixed; inset: 0; background: #D51515;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 9999; color: #fff;
    }
    #loader .loader-logo { font-size: 2.5rem; font-weight: 900; letter-spacing: 3px; }
    #loader .loader-sub  { font-size: .85rem; margin-top: .3rem; opacity: .8; }
    #loader .loader-spin {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .8s linear infinite; margin: 1.5rem 0 1rem;
    }
    #loader p { font-size: .85rem; opacity: .8; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── LOGIN SCREEN ─── */
    #login-screen {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem 1.5rem;
    }
    .login-logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 2rem; }
    .login-icon {
      width: 80px; height: 80px; background: var(--color-primary);
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; margin-bottom: .8rem; box-shadow: 0 4px 16px rgba(213,21,21,.3);
    }
    .login-company { font-size: 1.1rem; font-weight: 700; color: var(--color-secondary); }
    .login-tagline { font-size: .78rem; color: var(--color-text-sub); margin-top: .1rem; }
    .login-card {
      background: var(--color-surface); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 2rem 1.5rem; width: 100%; max-width: 380px;
    }
    .login-card h2 { font-size: 1.2rem; color: var(--color-secondary); margin-bottom: 1.5rem; }
    .login-card input {
      width: 100%; border: 1.5px solid var(--color-border); border-radius: 8px;
      padding: .75rem 1rem; font-size: .95rem; margin-bottom: 1rem;
      transition: border-color .2s;
    }
    .login-card input:focus { border-color: var(--color-primary); outline: none; }
    #btn-login {
      width: 100%; background: var(--color-primary); color: #fff;
      border-radius: 8px; padding: .9rem; font-size: 1rem; font-weight: 600;
      transition: background .2s;
    }
    #btn-login:hover { background: var(--color-primary-dark); }
    #btn-login:disabled { opacity: .6; }

    /* ─── APP SHELL ─── */
    #app-shell { display: none; height: 100vh; flex-direction: column; overflow: hidden; }

    /* Header */
    .app-header {
      height: var(--header-h); background: var(--color-primary);
      display: flex; align-items: center; padding: 0 1rem; gap: .8rem;
      box-shadow: 0 2px 6px rgba(0,0,0,.2); flex-shrink: 0; z-index: 100;
    }
    .header-icon {
      width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }
    .header-title { color: #fff; font-weight: 700; font-size: 1rem; flex: 1; }
    .header-user  { text-align: right; }
    #user-name    { display: block; color: #fff; font-size: .8rem; font-weight: 600; }
    #user-role    { color: rgba(255,255,255,.8); font-size: .7rem; }
    .header-signout {
      background: rgba(255,255,255,.15); color: #fff; border-radius: 6px;
      padding: .3rem .6rem; font-size: .75rem; margin-left: .5rem;
    }

    /* Main scroll area */
    #main-content {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--nav-h) + 1rem);
    }

    /* Bottom nav */
    #bottom-nav {
      height: var(--nav-h); background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: space-around;
      flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -2px 8px rgba(0,0,0,.06); z-index: 100;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; background: none; color: var(--color-text-sub);
      font-size: .65rem; gap: .2rem; height: 100%; padding: .3rem .2rem;
      transition: color .15s;
    }
    .nav-icon { font-size: 1.35rem; line-height: 1; }
    .nav-btn.active { color: var(--color-primary); }
    .nav-btn.active .nav-icon { transform: scale(1.08); }

    /* ─── CONTENT STYLES ─── */
    .content-pad { padding: 1rem; }

    .page-header {
      position: sticky; top: 0; z-index: 50;
      background: var(--color-surface); border-bottom: 1px solid var(--color-border);
      padding: .75rem 1rem; display: flex; align-items: center;
      justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .page-title { font-size: 1.05rem; font-weight: 700; color: var(--color-secondary); }
    .btn-sm { font-size: .8rem; padding: .4rem .8rem; border-radius: 6px; font-weight: 600; }
    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-primary:hover { background: var(--color-primary-dark); }

    .section-header {
      font-size: .78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--color-text-sub);
      padding: .5rem 0 .3rem; margin-top: .8rem; border-bottom: 1px solid var(--color-border);
      margin-bottom: .5rem;
    }

    /* KPI grid */
    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; margin-bottom: .8rem; }
    .kpi-card {
      background: var(--color-surface); border-radius: var(--radius);
      padding: .9rem .8rem; border-top: 3px solid var(--color-primary);
      box-shadow: var(--shadow);
    }
    .kpi-icon  { font-size: 1.2rem; margin-bottom: .3rem; }
    .kpi-value { font-size: 1.3rem; font-weight: 800; color: var(--color-primary); }
    .kpi-label { font-size: .72rem; color: var(--color-text-sub); margin-top: .1rem; }

    /* Vehicle card (driver home) */
    .vehicle-card {
      background: var(--color-secondary); border-radius: var(--radius);
      padding: 1.1rem 1rem; margin-bottom: .8rem; color: #fff;
    }
    .vc-plate { font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; }
    .vc-detail { font-size: .82rem; opacity: .8; margin-top: .2rem; }
    .vc-km { font-size: .82rem; margin-top: .4rem; opacity: .9; }

    /* List cards */
    .list-card {
      background: var(--color-surface); border-radius: var(--radius);
      padding: .9rem; margin-bottom: .6rem; box-shadow: var(--shadow);
      cursor: pointer; transition: box-shadow .15s;
    }
    .list-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); }
    .lc-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .25rem; }
    .lc-sub { font-size: .78rem; color: var(--color-text-sub); font-weight: 400; }
    .lc-meta { font-size: .75rem; color: var(--color-text-sub); margin-top: .15rem; }
    .plate-tag {
      background: var(--color-secondary); color: #fff;
      border-radius: 4px; padding: .1rem .4rem; font-size: .82rem; letter-spacing: 1px;
    }

    /* Table */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: .8rem; }
    table { width: 100%; border-collapse: collapse; font-size: .78rem; }
    th { background: var(--color-secondary); color: #fff; padding: .5rem .6rem; text-align: left; white-space: nowrap; }
    td { padding: .45rem .6rem; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: rgba(0,0,0,.015); }
    .empty-state {
      text-align: center; padding: 2rem; color: var(--color-text-sub); font-size: .85rem;
    }

    /* Badges */
    .badge {
      display: inline-block; font-size: .68rem; font-weight: 700;
      padding: .15rem .45rem; border-radius: 999px; text-transform: capitalize;
    }
    .badge-active, .badge-completed, .badge-present, .badge-delivered { background: #D5F5E3; color: #1D8348; }
    .badge-inactive, .badge-danger { background: #FADBD8; color: #922B21; }
    .badge-pending, .badge-in-transit { background: #FEF9E7; color: #B7950B; }
    .badge-late  { background: #FEF9E7; color: #B7950B; }
    .badge-absent { background: #FADBD8; color: #922B21; }
    .badge-high  { background: #FADBD8; color: #922B21; }
    .badge-medium { background: #FEF9E7; color: #B7950B; }
    .badge-low   { background: #D5F5E3; color: #1D8348; }
    .badge-admin { background: #E8DAEF; color: #6C3483; }
    .badge-manager { background: #D6EAF8; color: #1A5276; }
    .badge-driver { background: #D5F5E3; color: #1D8348; }
    .red { color: var(--color-danger) !important; }
    .danger { color: var(--color-danger); }

    /* Alert cards */
    .alert-card {
      border-radius: var(--radius); padding: .8rem 1rem;
      margin-bottom: .8rem; font-size: .82rem; line-height: 1.5;
    }
    .alert-card.danger { background: #FADBD8; border-left: 4px solid var(--color-danger); color: #7B241C; }
    .alert-card.info   { background: #D6EAF8; border-left: 4px solid var(--color-info); color: #1A5276; }
    .alert-card.warning { background: #FEF9E7; border-left: 4px solid var(--color-warning); color: #7D6608; }

    /* Form card */
    .form-card {
      background: var(--color-surface); border-radius: var(--radius);
      padding: 1.2rem 1rem; box-shadow: var(--shadow);
    }
    .f-group { margin-bottom: .9rem; }
    .f-group label {
      display: block; font-size: .78rem; font-weight: 600;
      color: var(--color-text-sub); margin-bottom: .3rem;
    }
    .f-group input, .f-group select {
      width: 100%; border: 1.5px solid var(--color-border); border-radius: 7px;
      padding: .6rem .8rem; font-size: .9rem; background: var(--color-surface);
      transition: border-color .2s;
    }
    .f-group input:focus, .f-group select:focus {
      border-color: var(--color-primary); outline: none;
    }
    .full-btn {
      width: 100%; padding: .9rem; border-radius: 8px; font-size: .95rem;
      font-weight: 700; margin-top: .5rem; background: var(--color-primary); color: #fff;
      box-shadow: 0 3px 10px rgba(213,21,21,.3);
    }
    .full-btn:hover { background: var(--color-primary-dark); }
    .full-btn:disabled { opacity: .6; }

    /* Toggle rows (inspection/cleaning) */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: .55rem 0; border-bottom: 1px solid var(--color-border); font-size: .84rem;
    }
    .toggle-group { display: flex; gap: .3rem; }
    .toggle-btn {
      border: 1.5px solid var(--color-border); border-radius: 6px;
      padding: .25rem .6rem; font-size: .75rem; background: var(--color-surface);
      color: var(--color-text-sub); transition: all .15s;
    }
    .toggle-btn.active {
      border-color: var(--color-primary); background: var(--color-primary);
      color: #fff;
    }

    /* Quick actions */
    .quick-actions {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-bottom: .8rem;
    }
    .qa-btn {
      background: var(--color-surface); border-radius: var(--radius);
      padding: .8rem .4rem; display: flex; flex-direction: column;
      align-items: center; gap: .3rem; box-shadow: var(--shadow);
      border: 1.5px solid var(--color-border); transition: all .15s;
    }
    .qa-btn:hover { border-color: var(--color-primary); background: #FFF5F5; }
    .qa-icon  { font-size: 1.4rem; }
    .qa-label { font-size: .68rem; color: var(--color-text-sub); text-align: center; font-weight: 600; }

    /* Module grid (all modules modal) */
    .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
    .module-tile {
      background: var(--color-surface); border-radius: 8px;
      border-top: 3px solid var(--mc, var(--color-primary));
      padding: .7rem .4rem; text-align: center; cursor: pointer;
      box-shadow: var(--shadow); transition: transform .1s;
    }
    .module-tile:active { transform: scale(.96); }
    .mt-icon  { font-size: 1.3rem; }
    .mt-label { font-size: .65rem; color: var(--color-text-sub); margin-top: .25rem; font-weight: 600; }

    /* FAB */
    .fab {
      position: fixed; bottom: calc(var(--nav-h) + 1rem); right: 1rem;
      width: 50px; height: 50px; background: var(--color-secondary); color: #fff;
      border-radius: 50%; font-size: 1.3rem; box-shadow: 0 4px 12px rgba(0,0,0,.3);
      z-index: 200; display: flex; align-items: center; justify-content: center;
    }

    /* Global Modal */
    #global-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 1000; align-items: flex-end;
    }
    .modal-inner {
      background: var(--color-surface); border-radius: 16px 16px 0 0;
      width: 100%; max-height: 85vh; overflow-y: auto; padding: 1rem;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: .8rem; border-bottom: 1px solid var(--color-border); margin-bottom: 1rem;
    }
    #modal-title { font-size: 1rem; font-weight: 700; }
    .modal-close {
      background: var(--color-background); border-radius: 50%;
      width: 30px; height: 30px; font-size: 1.2rem; color: var(--color-text-sub);
      display: flex; align-items: center; justify-content: center;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + 1.5rem); left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--color-secondary); color: #fff;
      border-radius: 8px; padding: .7rem 1.2rem; font-size: .84rem; font-weight: 600;
      z-index: 2000; opacity: 0; transition: all .3s; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-success { background: var(--color-success); }
    .toast-danger  { background: var(--color-danger); }
    .toast-warning { background: var(--color-warning); }
    .toast-info    { background: var(--color-info); }

    /* App shell flex */
    #app-shell { display: flex; }

    /* Safe areas */
    #bottom-nav { padding-bottom: max(env(safe-area-inset-bottom), 4px); }
    .app-header  { padding-top: env(safe-area-inset-top, 0); }
  </style>
</head>
<body>

<!-- ─── LOADER ─── -->
<div id="loader">
  <div class="loader-logo">ISE</div>
  <div class="loader-sub">Isha Steels Enterprises</div>
  <div class="loader-spin"></div>
  <p>App load ho rahi hai...</p>
</div>

<!-- ─── LOGIN SCREEN ─── -->
<div id="login-screen" style="display:none">
  <div class="login-logo">
    <div class="login-icon">🚗</div>
    <div class="login-company">Isha Steels Enterprises</div>
    <div class="login-tagline">Vehicle Operations Management</div>
  </div>
  <div class="login-card">
    <h2>Login karo</h2>
    <input id="inp-email" type="email" placeholder="Email address"
      autocomplete="email" autocapitalize="none">
    <input id="inp-pass"  type="password" placeholder="Password"
      autocomplete="current-password">
    <button id="btn-login" onclick="_doLogin()">Login</button>
  </div>
</div>

<!-- ─── APP SHELL ─── -->
<div id="app-shell" style="display:none">

  <!-- Header -->
  <div class="app-header">
    <div class="header-icon">🚗</div>
    <div class="header-title">ISE Vehicles</div>
    <div class="header-user">
      <span id="user-name">—</span>
      <span id="user-role">—</span>
    </div>
    <button class="header-signout" onclick="_signOut()">Logout</button>
  </div>

  <!-- Main scroll content -->
  <div id="main-content"></div>

  <!-- Bottom Nav -->
  <div id="bottom-nav"></div>

</div>

<!-- ─── GLOBAL MODAL ─── -->
<div id="global-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-inner">
    <div class="modal-header">
      <span id="modal-title">—</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- ─── SCRIPTS ─── -->
<script src="appconfig.js"></script>
<script src="app.js"></script>
<script>
  // Enter key = login
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none')
      _doLogin();
  });
  // Hide loader after 300ms (actual hide happens when data loads)
  setTimeout(function() {
    var l = document.getElementById('loader');
    if (l && document.getElementById('login-screen').style.display === '') l.style.display = 'none';
  }, 300);
</script>
</body>
</html>
